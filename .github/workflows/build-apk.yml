name: Build Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          validate-wrappers: false

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{print $1}')
          if [ -z "$JAVA_VER" ] || [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Java major version is '$JAVA_VER', which is lower than 17."
            exit 1
          fi
          echo "Active Java version ($JAVA_VER) is 17 or newer."

      - name: Validate Release Signing Secrets
        id: validate
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'AgriCropReleasePass2026' }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'agricrop-release' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'AgriCropReleasePass2026' }}
        run: |
          echo "github.repository: ${{ github.repository }}"
          echo "github.ref: ${{ github.ref }}"
          echo "github.event_name: ${{ github.event_name }}"
          echo "github.workflow_ref: ${{ github.workflow_ref }}"
          echo ""

          MISSING=0

          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "RELEASE_KEYSTORE_BASE64: set"
            KS_STATUS="set"
          else
            echo "RELEASE_KEYSTORE_BASE64: EMPTY"
            KS_STATUS="EMPTY"
            MISSING=1
          fi

          if [ -n "$RELEASE_STORE_PASSWORD" ]; then
            echo "RELEASE_STORE_PASSWORD: set"
            SP_STATUS="set"
          else
            echo "RELEASE_STORE_PASSWORD: EMPTY"
            SP_STATUS="EMPTY"
            MISSING=1
          fi

          if [ -n "$RELEASE_KEY_ALIAS" ]; then
            echo "RELEASE_KEY_ALIAS: set"
            KA_STATUS="set"
          else
            echo "RELEASE_KEY_ALIAS: EMPTY"
            KA_STATUS="EMPTY"
            MISSING=1
          fi

          if [ -n "$RELEASE_KEY_PASSWORD" ]; then
            echo "RELEASE_KEY_PASSWORD: set"
            KP_STATUS="set"
          else
            echo "RELEASE_KEY_PASSWORD: EMPTY"
            KP_STATUS="EMPTY"
            MISSING=1
          fi

          {
            echo "### Release Signing Diagnostics"
            echo "- github.repository: ${{ github.repository }}"
            echo "- github.ref: ${{ github.ref }}"
            echo "- github.event_name: ${{ github.event_name }}"
            echo "- github.workflow_ref: ${{ github.workflow_ref }}"
            echo ""
            echo "- RELEASE_KEYSTORE_BASE64: $KS_STATUS"
            echo "- RELEASE_STORE_PASSWORD: $SP_STATUS"
            echo "- RELEASE_KEY_ALIAS: $KA_STATUS"
            echo "- RELEASE_KEY_PASSWORD: $KP_STATUS"
          } >> $GITHUB_STEP_SUMMARY

          if [ "$MISSING" -ne 0 ]; then
            echo "signing_ready=false" >> $GITHUB_OUTPUT
            echo ""
            echo "Create them under Settings > Secrets and variables > Actions > Repository secrets (NOT Variables, NOT Environment, NOT Codespaces, NOT Dependabot). Names are case-sensitive."
            {
              echo ""
              echo "Create them under Settings > Secrets and variables > Actions > Repository secrets (NOT Variables, NOT Environment, NOT Codespaces, NOT Dependabot). Names are case-sensitive."
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "signing_ready=true" >> $GITHUB_OUTPUT
            echo ""
            echo "All release signing secrets are present."
            {
              echo ""
              echo "All release signing secrets are present."
            } >> $GITHUB_STEP_SUMMARY
          fi

      - name: Set up Release Keystore
        if: steps.validate.outputs.signing_ready == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Decoding RELEASE_KEYSTORE_BASE64 secret..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > ./release-key.jks || {
              echo "Error: Failed to decode RELEASE_KEYSTORE_BASE64 secret."
              exit 1
            }
          else
            echo "Error: RELEASE_KEYSTORE_BASE64 secret is missing from repository secrets. A persistent release keystore is required for release builds."
            exit 1
          fi

          if [ ! -s "./release-key.jks" ]; then
            echo "Error: release-key.jks was not created or is empty."
            exit 1
          fi
          echo "release-key.jks is ready."

      - name: Check Zego secrets reach the build
        if: steps.validate.outputs.signing_ready == 'true'
        env:
          ZEGO_APP_ID: ${{ secrets.ZEGO_APP_ID }}
          ZEGO_APP_SIGN: ${{ secrets.ZEGO_APP_SIGN }}
        run: |
          echo "ZEGO_APP_ID length: ${#ZEGO_APP_ID}"
          echo "ZEGO_APP_SIGN length: ${#ZEGO_APP_SIGN}"

      - name: Build Release APK
        if: steps.validate.outputs.signing_ready == 'true'
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'AgriCropReleasePass2026' }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'agricrop-release' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'AgriCropReleasePass2026' }}
          ZEGO_APP_ID: ${{ secrets.ZEGO_APP_ID }}
          ZEGO_APP_SIGN: ${{ secrets.ZEGO_APP_SIGN }}
        run: gradle :app:clean :app:assembleRelease --stacktrace --no-daemon

      - name: Verify and Validate Release APK
        if: steps.validate.outputs.signing_ready == 'true'
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Error: No release APK generated under app/build/outputs/apk/release"
            echo "Directory contents:"
            ls -la app/build/outputs/apk/release || true
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$APK_PATH")
          echo "Found APK at: $APK_PATH"
          echo "APK File Size: $FILE_SIZE bytes"

          if [ "$FILE_SIZE" -le 0 ]; then
            echo "Error: Generated APK is empty (0 bytes)."
            exit 1
          fi

          if ! unzip -t "$APK_PATH" > /dev/null 2>&1; then
            echo "Error: Generated APK is corrupted or not a valid zip archive."
            exit 1
          fi

          SHA256_SUM=$(sha256sum "$APK_PATH" | awk '{print $1}')
          echo "APK SHA-256 Checksum: $SHA256_SUM"
          echo "APK Verification SUCCESS!"

          # Save APK path for upload step
          echo "GENERATED_APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Upload Release APK Artifact
        if: steps.validate.outputs.signing_ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: BaagbaanBoi-Release-APK
          path: ${{ env.GENERATED_APK_PATH }}
          if-no-files-found: error

      - name: Build Debug Test APK (Fallback)
        if: steps.validate.outputs.signing_ready == 'false'
        env:
          ZEGO_APP_ID: ${{ secrets.ZEGO_APP_ID }}
          ZEGO_APP_SIGN: ${{ secrets.ZEGO_APP_SIGN }}
        run: |
          echo "::warning::Release signing secrets missing. Building DEBUG test APK instead. Not for release."
          gradle :app:assembleDebug --stacktrace --no-daemon
          DEBUG_APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$DEBUG_APK_PATH" ] || [ ! -f "$DEBUG_APK_PATH" ]; then
            echo "Error: No debug APK generated under app/build/outputs/apk/debug"
            exit 1
          fi
          echo "GENERATED_DEBUG_APK_PATH=$DEBUG_APK_PATH" >> $GITHUB_ENV
          {
            echo ""
            echo "This is a debug-signed APK that cannot update an installed release build."
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload Debug Test APK Artifact
        if: steps.validate.outputs.signing_ready == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: app-DEBUG-TEST-ONLY
          path: ${{ env.GENERATED_DEBUG_APK_PATH }}
          if-no-files-found: error
