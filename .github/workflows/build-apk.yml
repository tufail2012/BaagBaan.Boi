name: Build Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{print $1}')
          if [ -z "$JAVA_VER" ] || [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Java major version is '$JAVA_VER', which is lower than 17."
            exit 1
          fi
          echo "Active Java version ($JAVA_VER) is 17 or newer."

      - name: Set up Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Decoding RELEASE_KEYSTORE_BASE64 secret..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > ./release-key.jks
          fi

          if [ ! -f "./release-key.jks" ]; then
            echo "Generating release-key.jks for workflow build..."
            keytool -genkeypair -v \
              -keystore ./release-key.jks \
              -alias agricrop-release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass AgriCropReleasePass2026 \
              -keypass AgriCropReleasePass2026 \
              -dname "CN=AgriCrop, OU=Dev, O=AgriCrop, L=City, ST=State, C=US"
          fi

          if [ ! -f "./release-key.jks" ]; then
            echo "Error: ./release-key.jks could not be generated."
            exit 1
          fi
          echo "release-key.jks is ready."

      - name: Build Release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'AgriCropReleasePass2026' }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'agricrop-release' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'AgriCropReleasePass2026' }}
        run: gradle :app:clean :app:assembleRelease --stacktrace --no-daemon

      - name: Verify and Validate Release APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "Error: No release APK generated under app/build/outputs/apk/release"
            echo "Directory contents:"
            ls -la app/build/outputs/apk/release || true
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$APK_PATH")
          echo "Found APK at: $APK_PATH"
          echo "APK File Size: $FILE_SIZE bytes"

          if [ "$FILE_SIZE" -le 0 ]; then
            echo "Error: Generated APK is empty (0 bytes)."
            exit 1
          fi

          if ! unzip -t "$APK_PATH" > /dev/null 2>&1; then
            echo "Error: Generated APK is corrupted or not a valid zip archive."
            exit 1
          fi

          SHA256_SUM=$(sha256sum "$APK_PATH" | awk '{print $1}')
          echo "APK SHA-256 Checksum: $SHA256_SUM"
          echo "APK Verification SUCCESS!"

          # Save APK path for upload step
          echo "GENERATED_APK_PATH=$APK_PATH" >> $GITHUB_ENV

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaagbaanBoi-Release-APK
          path: ${{ env.GENERATED_APK_PATH }}
          if-no-files-found: error
